# Glance bookmarks — reference copy.
#
# The live file is services/glance/config/glance.yml on the Pi, which is
# gitignored (`**/config/**/*`) and therefore unversioned. This is a tracked
# copy of just the bookmarks widget so the link list survives a rebuild.
#
# To apply: paste the `- type: bookmarks` widget below into a column's
# `widgets:` list in glance.yml, then `docker restart glance`.
#
# Addresses use the Pi's static 192.168.1.42 rather than the .40 DHCP lease,
# and raw IPs rather than *.hommelab.local — the pretty names only resolve for
# clients using Pi-hole as their DNS, and `.local` is intercepted by mDNS on
# TVs and streaming boxes. See downloader/plan.md, Phase 4.

- type: bookmarks
  groups:
    - title: Media
      color: 200 70 50
      links:
        - title: Jellyfin
          url: http://192.168.1.42:8096
          icon: di:jellyfin
        - title: Jellyseerr
          url: http://192.168.1.42:5055
          icon: di:jellyseerr
        - title: Immich
          url: http://192.168.1.42:2283
          icon: di:immich

    - title: Automation
